front:
  text: 上清洞玄明燈上經乃十夫太微通妙朗徹遐幽續太陽之玄光演明燈之寶章始於自然稟日月之華精皎景微冥散暉朗空無天不普無幽不照無界不玄自非玄挺符會七世積功斯文不可而窺也兆遇之者寶而朂焉夫受此經齎明金青玉之誓於絶崖而授之焉若闕信盟又無殊行悠悠之徒勿妄宣示必欲受之者皆先告齋惟許虛靈瑞感然後傳之爾太極髙玄真人登九霄瓊臺稽首窗軒之下請問紫宸丈人開曚悟慧肘步膝趨時移晷刻然後告之曰所咨妙焉今以煥七玄以決善惡演禮誦之寶章相告經旨尋峻天科嚴烈實長靜霞舉之梯級常蓋以玄雲衛以飛龍天兵羽騎晝夜無休凡飾以琉璃珠玉光煥赫自非上真不能眄此宫墻矣夫研味虛玄咀嚼飛根披講寶章莫如齋謝齋謝莫若上清洞玄燒香然燈禮誦也然燈法間相去一丈五尺以十燈著竿上口宣其旨焉衆燈之玄綱千燈羅列如威儀多少意誠也夫明燈上象星辰次曜七祖賾妙難宣修之三年白日升天禮燈之法先向東次向西次向南次向北因仰天心存而禮之中央依真文之誦也同齋者唱讃其後案嚴香火於前雲趣勿使煙絶斯法廣被拔脫幽夜之苦赦生死之災虔向之子仰信之夫家橫染考疾欲建齋以自拔脫者當獻以名香清油斤兩斗斛隨意所奉精修勵行墮者當以主人所齎香油充紏罰之費以補闕愆兆輩修道日邇望速而應遲便謂道遼虛誕命也如何兆既不能超迹絶巔焉得七祖降福退不能於家延同志齋講常飛輪驟競以酒聲自娛上違玄教中墮祖禰宰三牲以篤孝哀乎痛哉今我心酸至於福消禍淫便咎神明方位祈禱冥漠可謂臨渴而鑿井奚所復逮哉死嬰苦痛殃流後代至於子孫餧病皆坐今世不行功善委化任念恣懷肆毒所招矣愚桀之夫聞慈戒若融風之唳天雉鵝之飛鳴犬而笑良可哀乎施之不信也兆欲延年長存消災救疾修盛德要至真釋七玄宜知上清善賢施惡之報應大戒兼之禮誦然後災禍可排景漢可升也禮燈之法政都禮呪而已特欲苦厲拔標所不禁也太極真人曰若禮燈王及行燈其頌如左太哉七寶宫自然生蓮華煒燁開夜光倐歘登太霞仰觀玄真闕雲樓鬱嵳峩流煥曜玄空催兵徴萬魔拔苦羅難中積劫方嬰牙齋講度七祖積福潤兆家太妙出神暉無形寂無影邊蕩無界外豁然普濟往舉度七玄苦寥寥覩長靜拔度五難滯應感乘雲上明燈徹十方冥漆無不朗赫赫玄真堂煌煌映十方寥豁沈塞開洞釋衆難身七祖三塗解無復憂惱患緑蓋映十方飛舉披雲波神燈藹九冥燭朗攝山阿梵身六會宫世世為仙家虛煙咸宿緣福降消萬魔苦魂應感散氷離於流沙積禍不知巳豈是一日愆七祖受此殃長在河海間上真念是苦虛心九重門稽首禮玄燈度名東華宫
