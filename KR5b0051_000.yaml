body:
  text: 右禮王竟便行燈頌十九首如左千真朝瓊闕朗徹洞虛空仰存無為尊飛霞戲雲間清靜無滯難身生七寶光我為海船師故能釋三羅夜光通幽谷苦身洗蕩開虛煙散八極朗照入太微禮誦無上教福慶真巍巍飄飄結落通寂寂滿八丘三秦生雲影虛無雙太元洞觀極十方逍遙散苦軀飛輪藹太空無形亦無迹縱洛任飛輪蕭蕭超界外被褐詠夜光諸天悉勝太罪福不由他量自由爾身積功若不早晨夜建福田歸命無為道終當見正真煥爛明光暉朗徹無隱深赫耀絶冥外福降積福遷庠序觀十方普濟一切人嚴我玄真轡携手擎玉符明燈扣瓊鍾應響已得無一日見三達釋我積世憂遷㢟七寶宫回輪曲嶽阿息駕緑蓋房豈知年歲多漱吸金液精萬劫方嬰下看榮競中不解可奈何玄暉映曲谷豁朗徹淵泉暢映流鬱交纒繞盈酆山七祖反胎生長安五色宫蓊藹亭空曜鬱勃入太清天狩左右使回輪歸南傾恍惚九載外暫超石啓靈七祖獲胎仙南宫更受生飛輪藹空洞眄觀千百仞理悟齊一揮聚煙吸然散身輕體無為四朗應景煥地獄三惡道悉得脫籠絆嘯歌九玄臺崇嶺凝凄凄心理六覺暢自棄塵濁緣流霞耀金室虛堂散玄暉積感致靈降形單道亦分倐欻眄萬劫豈覺周億椿秀圃蔚神階朱瓊緯綝流風鼓空同玉棲翳虛鳳鳴紫煙纏曲宇丹暉繞緑軿飛旗鬱玄蓋羽節耀紫清澄景九霄際遨遊戲鳳城顧看榮競子一樂同朝生騰轡控玄暉晏景洞野外流浪尋靈人合形慶霄際手披朱玉户朗若神沖泰金闕鬱嵳峩清影無塵穢解旍玄閬臺適我良願會脫徙三塗難保鍊固年邁智慧起本無朗朗超十方結空峙玄霄諸天挹流芳其妙難思議虛感真實通有有無不有無無無不容智慧常觀身學道之所先眇眇入玄肆自然録我神天尊常擁護魔王為保言晃晃金剛軀超超太上仙智慧生戒根真道戒為主三寶由是興髙聖所崇授泛此不死舟倐欻濟大有當此説戒時諸仙來稽首太微天帝受戒時頌夫見然燈皆當誦此文不但受戒時然燈也叩齒微為之勿令他聞聲凡口齒悉耳太上散十方華燈通精誠諸天皆赫然諸地悉朗明我身亦光徹五藏生華榮炎景照太無遐想繁玉清丹精竒太無玄陽空中響含形滅苦根幽妙至真想垂華不現實因緣不光象我身亦如之乘化託流景夜光表陽丹迢迢照靈室諸天普光顯諸隂即巳滅我神亦聰明常玩智與慧逍遙適道運遷謝任天勢舉形躡空洞夜燭煥流萃太微天帝曰徒然燈而不知誦此六天大魔府不過人死命八方諸天亦不遣玉童玉女飛天神人不降於子矣十方三界不度兆名於東華南宫不受子七祖父母化生之道施食衆生呪勤修大道法精誠感太冥真降魔魅散衆妖皆滅形七祖度南宫兆身升上清既福無不普法食施衆生上清洞玄明燈上經
